repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm run prettier:fix
        language: system
        types: [text]
        files: \.(js|ts|json|md|yaml|yml)$
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: pnpm run lint:fix
        language: system
        types: [text]
        files: \.(js|ts)$
        pass_filenames: false

      - id: typecheck
        name: typecheck
        entry: pnpm run build
        language: system
        files: \.ts$
        pass_filenames: false
        stages: [pre-push]

      - id: test
        name: test
        entry: pnpm run test
        language: system
        pass_filenames: false
        stages: [pre-push]
