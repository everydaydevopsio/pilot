# Project-local Codex MCP template. Run `make setup` before starting
# Codex from the repository root.
[mcp_servers.pilot]
command = "node"
args = ["dist/mcp/index.js"]
cwd = "."
enabled = true

# Require an explicit Accept for every tool exposed by this server, including
# tools added in future releases.
default_tools_approval_mode = "approve"
