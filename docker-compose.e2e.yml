# E2E test stack — MCP mode only.
# The MCP server launches Chrome itself via browser_start.
# Run: docker compose -f docker-compose.e2e.yml up --build

services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    shm_size: '1gb'
    command: pnpm run test:e2e:mcp:ci
    environment:
      - PILOT_CHROME_PATH=/usr/bin/google-chrome-stable
      - PILOT_HEADLESS=true
