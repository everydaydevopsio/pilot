# E2E test stack — MCP mode only.
# The MCP server launches Chrome itself via browser_start.
# Run: docker compose -f docker-compose.e2e.yml up --build

services:
  e2e:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: pnpm run test:e2e:mcp
    environment:
      # chromium is installed in Dockerfile.e2e (works on amd64 and arm64)
      - AAB_CHROME_PATH=/usr/bin/chromium
