# E2E test stacks.
#
# HTTP mode  (--profile http): tests the WebSocket/HTTP API.
#   Chrome runs as a separate service; the HTTP server connects to it externally.
#   Run: docker compose -f docker-compose.e2e.yml --profile http up --build
#
# MCP mode   (--profile mcp): tests MCP tools end-to-end.
#   No separate Chrome service — the MCP server launches Chrome itself via
#   browser_start. Chrome must be installed in the test image (Dockerfile.e2e).
#   Run: docker compose -f docker-compose.e2e.yml --profile mcp up --build

services:
  # ── HTTP mode ────────────────────────────────────────────────────────────────

  chrome:
    profiles: [http]
    image: zenika/alpine-chrome:latest
    command:
      - --no-sandbox
      - --headless=new
      - --disable-gpu
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - about:blank
    ports:
      - '9333:9222'
    healthcheck:
      test: ['CMD-SHELL', 'sh -c "echo > /dev/tcp/localhost/9222" 2>/dev/null']
      interval: 2s
      timeout: 5s
      retries: 10

  e2e:
    profiles: [http]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: pnpm run test:e2e
    environment:
      - E2E_CDP_PORT=9222
      - E2E_CDP_HOST=chrome
      - E2E_AAB_PORT=8866
    depends_on:
      chrome:
        condition: service_healthy
    network_mode: host

  # ── MCP mode ─────────────────────────────────────────────────────────────────

  e2e-mcp:
    profiles: [mcp]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    command: pnpm run test:e2e:mcp
    environment:
      # MCP server will find Chrome at this path (installed in Dockerfile.e2e)
      - AAB_CHROME_PATH=/usr/bin/google-chrome-stable
