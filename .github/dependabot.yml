version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      testing:
        patterns:
          - 'jest'
          - '@jest/*'
          - '@types/jest'
          - 'ts-jest'
      typescript:
        patterns:
          - 'typescript'
          - 'ts-*'
          - '@types/*'
      dev-tooling:
        dependency-type: 'development'
        patterns:
          - 'eslint*'
          - 'prettier'
          - '@typescript-eslint/*'
          - '@eslint/*'
          - 'typescript-eslint'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
