name: Smoke Test

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Run smoke test (MCP server start + tool list)
        run: docker compose -f docker-compose.smoke.yml up --build --abort-on-container-exit --exit-code-from smoke

      - name: Capture docker logs on failure
        if: failure()
        run: |
          mkdir -p /tmp/smoke-logs
          docker compose -f docker-compose.smoke.yml logs > /tmp/smoke-logs/compose.log 2>&1 || true

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs
          path: /tmp/smoke-logs/
          retention-days: 7
