name: Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump_and_tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.select.outputs.version }}
      tag: ${{ steps.select.outputs.tag }}
      release_notes: ${{ steps.notes.outputs.release_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get previous tag
        id: prev
        uses: WyriHaximus/github-action-get-previous-tag@v2
        with:
          fallback: v0.0.0

      - name: Calculate next versions
        id: semver
        uses: WyriHaximus/github-action-next-semvers@v1
        with:
          version: ${{ steps.prev.outputs.tag }}

      - name: Select version
        id: select
        run: |
          case "${{ inputs.release_type }}" in
            patch) VERSION="${{ steps.semver.outputs.patch }}" ;;
            minor) VERSION="${{ steps.semver.outputs.minor }}" ;;
            major) VERSION="${{ steps.semver.outputs.major }}" ;;
          esac
          # Remove v prefix for package.json
          VERSION_NUM="${VERSION#v}"
          echo "version=${VERSION_NUM}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Selected version: ${VERSION_NUM} (tag: ${VERSION})"

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Update package.json version
        run: npm version ${{ steps.select.outputs.version }} --no-git-tag-version

      # OPENAI_API_KEY is an organization secret, so a missing key means
      # misconfiguration, not an opt-out: fail here rather than tag a release
      # whose changelog and release notes were quietly skipped. Scoped to this
      # step so the key is never exported to the whole job, where dependency
      # installs, builds and every third-party action would inherit it.
      - name: Require OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY//[[:space:]]/}" ]; then
            echo "::error::OPENAI_API_KEY is not available to this repository. Grant the organization secret to everydaydevopsio/pilot." >&2
            exit 1
          fi

      # castoff reads `git describe --tags --abbrev=0 HEAD^` and logs from
      # there to HEAD, so it runs before the release commit is made and the
      # tag is created.
      - name: Generate AI release notes
        id: notes
        uses: everydaydevopsio/castoff/castoff@v2
        env:
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        with:
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          tag: ${{ steps.select.outputs.tag }}

      # No guard on changelog_entry: the action rejects an empty entry, which
      # is the signal that castoff produced nothing usable.
      - name: Update CHANGELOG.md
        uses: everydaydevopsio/castoff/changelog@v2
        with:
          version: ${{ steps.select.outputs.version }}
          entry: ${{ steps.notes.outputs.changelog_entry }}

      - name: Commit, tag and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.select.outputs.version }}"
          git tag ${{ steps.select.outputs.tag }}
          git push origin HEAD:main
          git push origin ${{ steps.select.outputs.tag }}

  publish:
    needs: [bump_and_tag]
    if: always() && (needs.bump_and_tag.result == 'success' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            TAG="${{ needs.bump_and_tag.outputs.tag }}"
            VERSION="${{ needs.bump_and_tag.outputs.version }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Enable corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test

      - name: Verify version match
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Version mismatch: package.json has $PKG_VERSION but expected ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: Verify CLI starts
        run: node dist/mcp/index.js --help

      - name: Publish to npmjs
        run: npm publish --access public --provenance

      # castoff notes come from the bump_and_tag job, which only runs on
      # workflow_dispatch. A tag pushed by hand skips that job, so fall back to
      # GitHub's own generated notes rather than publishing an empty body.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.bump_and_tag.outputs.release_notes }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${NOTES//[[:space:]]/}" ]; then
            printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/release-notes.md"
            gh release create "${TAG}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md"
          else
            echo "No castoff notes for ${TAG}; falling back to generated notes."
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi
